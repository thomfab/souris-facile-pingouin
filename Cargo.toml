[package]
name = "souris-facile-pingouin"
version = "0.1.0"
edition = "2024"
description = "Move or resize the window under the pointer by holding modifier keys and moving the mouse"
license = "GPL-2.0-or-later"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
x11rb = { version = "0.14.0", features = ["randr", "xinput", "shape"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
