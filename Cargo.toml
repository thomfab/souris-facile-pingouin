[package]
name = "souris-facile-pingouin"
version = "0.3.0"
edition = "2024"
description = "Move or resize the window under the pointer by holding modifier keys and moving the mouse"
license = "GPL-2.0-or-later"

[dependencies]
fontdue = "0.9.5"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
toml = "1.1.8"
toml_edit = "0.25.17"
x11rb = { version = "0.14.0", features = ["randr", "xinput", "shape"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
